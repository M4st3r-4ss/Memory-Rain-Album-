<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#38BDF8">
  <meta name="description" content="Photo and video upload with animated rain effect">
  <title>Memory Rain</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login Screen -->
  <div id="loginScreen" class="login-screen">
    <div class="login-container">
      <div class="login-heart">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </div>
      <h1 class="login-title">Memory Rain</h1>
      <p class="login-subtitle">Enter password to continue</p>
      <form id="loginForm" class="login-form">
        <input
          type="password"
          id="passwordInput"
          class="login-input"
          placeholder="Password"
          autocomplete="off"
        >
        <button type="submit" class="login-btn">
          <span>Enter</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
      </form>
      <div id="loginError" class="login-error"></div>
    </div>
  </div>

  <!-- Main App -->
  <div class="container" id="mainApp" style="display: none;">
    <header class="header">
      <h1 class="title">
        Memory Rain
        <svg class="heart-icon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </h1>
      <button class="upload-btn" id="uploadBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        Upload Memory
      </button>
    </header>

    <div class="rain-container" id="rainContainer"></div>

    <div class="upload-modal" id="uploadModal">
      <div class="modal-content">
        <button class="close-btn" id="closeModal">&times;</button>
        <h2 class="modal-title">Upload a Memory</h2>

        <div class="upload-area" id="uploadArea">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <p class="upload-text">Drop your photos or videos here</p>
          <p class="upload-subtext">or click to browse (multiple files allowed)</p>
          <input type="file" id="fileInput" accept="image/*,video/*" multiple hidden>
        </div>

        <div class="upload-progress" id="uploadProgress" style="display: none;">
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <p class="progress-text" id="progressText">Uploading...</p>
        </div>
      </div>
    </div>

    <div class="viewer-modal" id="viewerModal">
      <button class="close-btn viewer-close" id="closeViewer">&times;</button>
      <div class="viewer-content" id="viewerContent"></div>
      <button class="download-btn" id="downloadBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Download
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
